<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Games</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS propio -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>

    <!-- Menú de navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">GS Games</a>
            <!-- Botón de menú colapso -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Menú colapsable -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <!-- Categoría simulada: Consolas -->
                    <li class="nav-item"><a class="nav-link" href="#">Consolas</a></li>
                    <!-- Categoría simulada: Accesorios -->
                    <li class="nav-item"><a class="nav-link" href="#">Accesorios</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Encabezado -->
    <header id="inicio" class="bg-primary text-white text-center py-4">
        <h1>GS Games</h1>
        <p>Tu tienda de consolas y accesorios</p>
    </header>

    <!-- Carousel -->
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <!-- Indicadores -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
        </div>
        <!-- Contenedor imágenes Carousel -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/img/images.jpg" class="d-block w-100" alt="Promoción 1">
            </div>
            <div class="carousel-item">
                <img src="assets/img/images2.jpg" class="d-block w-100" alt="Promoción 2">
            </div>
        </div>
        <!-- Botón retroceder Carousel -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <!-- Botón avanzar Carousel -->
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </div>

    <!-- Formulario de búsqueda -->
    <section class="container mt-4">
        <form id="form-busqueda" class="d-flex">
            <input type="text" id="input-busqueda" class="form-control me-2" placeholder="Buscar producto...">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
    </section>

    <!-- Resumen del carrito -->
    <section class="container mt-3">
        <div id="resumen-carrito" class="alert alert-secondary">
            Carrito: 0 producto(s) - Total: $0
        </div>
    </section>

    <!-- Catálogo de productos -->
    <main class="container my-5">
        <h2 class="text-center mb-4">Catálogo de Productos</h2>
        <div class="row" id="contenedor-productos">
            <!-- Aquí script.js inserta las tarjetas -->
        </div>
    </main>

    <!-- Modal Detalle de Producto -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalDetalleLabel">Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="modal-img" src="" class="img-fluid mb-3" alt="Producto">
                    <p id="modal-descripcion">Descripción</p>
                    <p id="modal-precio">Precio</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="btn-agregar-modal" class="btn btn-primary">Agregar al Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="contacto" class="bg-dark text-white text-center py-4">
        <p>&copy; 2026 GS Games. Todos los derechos reservados.</p>
        <p>Contacto: contacto@gsgames.cl</p>
        <p>Síguenos en <a href="https://instagram.com" class="text-white" target="_blank">Instagram</a></p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS propio de la actividad -->
    <script src="assets/js/script.js"></script>

</body>

</html>
